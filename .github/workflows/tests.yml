# Runs the automatic tests (npm test) on every push and pull request to main.
# A red ❌ next to a commit on GitHub means a rule broke — fix it before relying on that deploy.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install (root + backend)
        run: |
          npm ci
          npm ci --prefix backend
      - name: Type check (backend)
        run: npx --prefix backend tsc -p backend --noEmit
      - name: Run tests
        run: npm test
