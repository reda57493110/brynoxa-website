<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('brynoxa-theme')
          var theme = 'dark'
          if (stored) {
            var parsed = JSON.parse(stored)
            if (parsed && parsed.state && parsed.state.theme) theme = parsed.state.theme
          }
          var locale = 'en'
          var locStored = localStorage.getItem('brynoxa-locale')
          if (locStored) {
            var locParsed = JSON.parse(locStored)
            if (locParsed && locParsed.state && locParsed.state.locale) locale = locParsed.state.locale
          }
          var root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          root.style.colorScheme = theme
          root.setAttribute('data-theme', theme)
          root.lang = locale
          root.dir = locale === 'ar' ? 'rtl' : 'ltr'
          root.setAttribute('data-locale', locale)
        } catch (e) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Brynoxa — PCs, laptops, and components. Cash on delivery across Morocco." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Brynoxa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
